# ========================================
# Development Profile Configuration
# ========================================

# ========================================
# Database Configuration - Development
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/startupsync
spring.datasource.username=postgres
spring.datasource.password=Shashi@123
spring.jpa.hibernate.ddl-auto=update

# ========================================
# Logging - Development
# ========================================
logging.level.root=INFO
logging.level.com.startupsync=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=DEBUG

# ========================================
# CORS - Development
# ========================================
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173

# ========================================
# JWT - Development
# ========================================
jwt.secret=dev-secret-key-for-development-only-not-for-production-use-must-be-64-chars-min!!
jwt.expiration=86400000

# ========================================
# Mail - Development (Console Output)
# ========================================
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=dev
spring.mail.password=dev

# ========================================
# Server - Development
# ========================================
server.error.include-stacktrace=always
server.error.include-binding-errors=always

# ========================================
# DevTools - Development
# ========================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
