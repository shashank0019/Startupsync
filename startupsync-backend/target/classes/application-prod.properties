# ========================================
# Production Profile Configuration
# ========================================

# ========================================
# Server Configuration - Production
# ========================================
server.port=8080
server.servlet.context-path=/api
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.compression.enabled=true
server.compression.min-response-size=1024

# ========================================
# Database Configuration - Production
# ========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:startupsync_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.jpa.hibernate.ddl-auto=validate

# ========================================
# JPA/Hibernate - Production
# ========================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ========================================
# Logging - Production
# ========================================
logging.level.root=WARN
logging.level.com.startupsync=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.file.name=/var/log/startupsync/application.log
logging.file.max-size=50MB
logging.file.max-history=30
logging.file.total-size-cap=1GB

# ========================================
# JWT - Production
# ========================================
jwt.secret=${JWT_SECRET:your-production-secret-key-must-be-at-least-32-characters-long}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ========================================
# CORS - Production
# ========================================
cors.allowed-origins=${ALLOWED_ORIGINS:https://yourdomain.com,https://www.yourdomain.com}
cors.allow-credentials=true

# ========================================
# Mail - Production
# ========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}

# ========================================
# OAuth2 - Production
# ========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ========================================
# Actuator - Production
# ========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# ========================================
# File Upload - Production
# ========================================
file.upload.dir=/var/startupsync/uploads
file.upload.max-size=10485760

# ========================================
# Security Headers - Production
# ========================================
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
