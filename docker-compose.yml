version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: startupsync-db
    environment:
      POSTGRES_DB: startupsync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Shashi@123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./startupsync-backend
    container_name: startupsync-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/startupsync
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Shashi@123
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: